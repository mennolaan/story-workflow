{
  "schema_version": "1.1",
  "name": "documentation-verify-drift",
  "description": "Behavioral case; graders are separate from the task prompt.",
  "tags": [
    "documentation",
    "verification",
    "smoke"
  ],
  "runs": 3,
  "execution": {
    "model": "sonnet",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ],
    "append_system_prompt": "Use only supplied fixture facts. Do not inspect eval case files, graders or expected answers. Do not start a real board, PR, cloud job or Desktop story. Return the requested report in chat; do not write files unless the task explicitly requires it.",
    "prompt": "Verify documentation for a completed change from this complete fixture. Return evidence gaps directly, without another agent.\nCommitted src/retries.ts defaults to two attempts. docs/retries.md says five and guarantees a refund within 24 hours. Frozen scope only approved two retries; refund policy was explicitly out of scope. Unit tests passed but none exercised external wiki publication. DOC-1 requires updating the repository guide; DOC-2 requires publication of the approved runbook to a private wiki, whose access failed. The implementer says all documentation is done."
  },
  "graders": [
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS only if it identifies five-versus-two drift, the unsupported refund guarantee and unverified required wiki publication. It must distinguish a draft from publication and request actual evidence/correction. FAIL if a passing unit suite or implementer's assertion is treated as proof of DOC-2."
    },
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?documentation\"",
      "arm": "with-only"
    }
  ]
}
