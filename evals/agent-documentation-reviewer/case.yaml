{
  "schema_version": "1.1",
  "name": "agent-documentation-reviewer",
  "description": "Behavioral case; graders are separate from the task prompt.",
  "tags": [
    "agents",
    "documentation"
  ],
  "runs": 3,
  "execution": {
    "model": "sonnet",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Agent",
      "Read",
      "Glob",
      "Grep",
      "Bash"
    ],
    "append_system_prompt": "Use only supplied fixture facts. Do not inspect eval case files, graders or expected answers. Do not start a real board, PR, cloud job or Desktop story. Return the requested report in chat; do not write files unless the task explicitly requires it.",
    "prompt": "Act as orchestrator. Invoke story-workflow:documentation-reviewer with model sonnet and effort medium, verify mode, on this snapshot: frozen DOC-1 requires docs/api.md to describe maxRetries=2; code excerpt src/config.ts sets 2; docs/api.md still says 5. Tests check parsing only. All fixture excerpts are supplied. Ask for a bounded cited report, with no edits, and relay it."
  },
  "graders": [
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS only if it reports the 5-versus-2 drift, cites docs/api.md and src/config.ts, explains why parser tests do not certify the documented default, and proposes changing the documented value to 2. It must assign the correction to the known file owner or explicitly flag ownership as unresolved when the fixture supplies no owner. FAIL on a clean result, invented execution/source edits, a missing correction, or an invented named owner. Source/coverage limits are appropriate."
    },
    {
      "name": "agent-used",
      "type": "tool_used",
      "tool": "Agent",
      "input_match": "\"subagent_type\"\\s*:\\s*\"story-workflow:documentation-reviewer\"",
      "arm": "with-only"
    },
    {
      "name": "no-write",
      "type": "tool_used",
      "tool": "Write",
      "min": 0,
      "max": 0
    },
    {
      "name": "requested-worker-settings",
      "type": "tool_used",
      "tool": "Agent",
      "input_match": "(?=[\\s\\S]*\"subagent_type\"\\s*:\\s*\"story-workflow:documentation-reviewer\")(?=[\\s\\S]*\"model\"\\s*:\\s*\"sonnet\")(?=[\\s\\S]*\"effort\"\\s*:\\s*\"medium\")[\\s\\S]*",
      "arm": "with-only"
    }
  ]
}
