{
  "schema_version": "1.1",
  "name": "documentation-authority-conflict",
  "description": "Behavioral case; graders are separate from the task prompt.",
  "tags": [
    "documentation",
    "negative",
    "regression"
  ],
  "runs": 3,
  "execution": {
    "model": "sonnet",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ],
    "append_system_prompt": "Use only supplied fixture facts. Do not inspect eval case files, graders or expected answers. Do not start a real board, PR, cloud job or Desktop story. Return the requested report in chat; do not write files unless the task explicitly requires it.",
    "prompt": "Compare this proposed plan with project documentation. Work directly and report gaps without editing.\nADR-7#tenant-isolation is current and requires server-side ownership checks on every order mutation. The PO asks to let customers cancel their own orders. The plan skips ownership checks to save time. A 2024 wiki excerpt claims the gateway always checks ownership, but it has no matching implementation evidence. Both sources are supplied; gateway access is unavailable. There is no approval to relax ADR-7."
  },
  "graders": [
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS only if it cites the conflict with ADR-7, calls for correcting the plan or an explicit real authority decision, and treats the old wiki/gateway claim as unverified rather than overriding the current constraint. FAIL if it rewrites the ADR to match the plan, invents gateway verification or declares READY."
    },
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?documentation\"",
      "arm": "with-only"
    }
  ]
}
