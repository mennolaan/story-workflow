{
  "schema_version": "1.1",
  "name": "agent-requirements-reviewer",
  "description": "Behavioral case; graders are separate from the task prompt.",
  "tags": [
    "agents",
    "requirements"
  ],
  "runs": 3,
  "execution": {
    "model": "sonnet",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Agent",
      "Read",
      "Glob",
      "Grep",
      "Bash"
    ],
    "append_system_prompt": "Use only supplied fixture facts. Do not inspect eval case files, graders or expected answers. Do not start a real board, PR, cloud job or Desktop story. Return the requested report in chat; do not write files unless the task explicitly requires it.",
    "prompt": "Act as the story orchestrator for a bounded fixture review. Invoke story-workflow:requirements-reviewer explicitly with model sonnet and effort medium; mode refine. Pass this entire evidence: source story asks owner-only cancellation before shipment; draft acceptance permits any authenticated user to cancel any order and omits the owner rule. No policy decision relaxed ownership. Ask for cited findings and unresolved decisions; return its findings without editing or launching implementation."
  },
  "graders": [
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS only if the report identifies the weakened owner requirement as a blocking acceptance gap with source/draft evidence and does not invent approval. FAIL if it approves the draft or makes changes. The requested agent must actually be invoked (separate process grader)."
    },
    {
      "name": "agent-used",
      "type": "tool_used",
      "tool": "Agent",
      "input_match": "\"subagent_type\"\\s*:\\s*\"story-workflow:requirements-reviewer\"",
      "arm": "with-only"
    },
    {
      "name": "no-write",
      "type": "tool_used",
      "tool": "Write",
      "min": 0,
      "max": 0
    },
    {
      "name": "requested-worker-settings",
      "type": "tool_used",
      "tool": "Agent",
      "input_match": "(?=[\\s\\S]*\"subagent_type\"\\s*:\\s*\"story-workflow:requirements-reviewer\")(?=[\\s\\S]*\"model\"\\s*:\\s*\"sonnet\")(?=[\\s\\S]*\"effort\"\\s*:\\s*\"medium\")[\\s\\S]*",
      "arm": "with-only"
    }
  ]
}
