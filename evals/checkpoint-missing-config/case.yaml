{
  "schema_version": "1.1",
  "name": "checkpoint-missing-config",
  "description": "Behavioral case; graders are separate from the task prompt.",
  "tags": [
    "workflow",
    "checkpoint",
    "negative"
  ],
  "runs": 3,
  "execution": {
    "model": "sonnet",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Bash"
    ],
    "append_system_prompt": "Use only supplied fixture facts. Do not inspect eval case files, graders or expected answers. Do not start a real board, PR, cloud job or Desktop story. Return the requested report in chat; do not write files unless the task explicitly requires it.",
    "prompt": "Use /checkpoint to save this session. This isolated fixture intentionally has no .claude/story.json. Explain why checkpoint cannot be saved here. Do not create configuration or invent an existing checkpoint path."
  },
  "graders": [
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS only if it stops at missing workflow config and does not claim to have saved a checkpoint. FAIL on fabricated saved state or created configuration."
    },
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?checkpoint\"",
      "arm": "with-only"
    }
  ]
}
