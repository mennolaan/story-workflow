{
  "schema_version": "1.1",
  "name": "requirements-po-ready",
  "description": "Behavioral case; graders are separate from the task prompt.",
  "tags": [
    "requirements",
    "refinement"
  ],
  "runs": 3,
  "execution": {
    "model": "sonnet",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ],
    "append_system_prompt": "Use only supplied fixture facts. Do not inspect eval case files, graders or expected answers. Do not start a real board, PR, cloud job or Desktop story. Return the requested report in chat; do not write files unless the task explicitly requires it.",
    "prompt": "Refine the following story. Work directly and return a handoff draft, not code.\nPO: the authenticated owner may cancel an order only in confirmed state. Dispatching is too late. Cancellation and dispatch share an atomic compare-and-set transition; one wins. Repeating a completed cancellation returns that state without another event. Refund behavior is out of scope. Existing API conventions define conflict responses and private not-found behavior. Existing shared transition types must be settled before service and UI tracks start. This is all fixture evidence; provide stable requirement ids, scenarios, task/contract dependencies, documentation impact and an evaluation plan. Exact repository paths still require inspection before final claims."
  },
  "graders": [
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS only if the handoff preserves owner/state/race/idempotency requirements and refund exclusion, includes negative and concurrency scenarios with persisted-event observations, names foundation dependency before UI/service tracks, and does not invent verified repository paths or deployment facts. It may be ready for bounded planning, but cannot claim final file independence without inspection. FAIL if it drops the race/idempotency conditions or expands refunds."
    },
    {
      "name": "activation",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?requirements\"",
      "arm": "with-only"
    }
  ]
}
